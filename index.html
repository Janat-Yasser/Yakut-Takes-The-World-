<!DOCTYPE html>
<html lang="en" dir="ltr" data-w="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yakut's Royal World Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600;700&family=Bodoni+Moda:opsz,wght@6..96,700..900&family=Baloo+Bhaijaan+2:wght@500..800&family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Plan: a family photo magazine. Calm paper background so the (very colorful) photos are the star.
   One type system everywhere; each country only changes the accent color.
   Home = hero + newsstand of clean covers. Country = opener + photo/story spreads + Karim's quote. */
:root{
  --paper:#faf6f1; --card:#ffffff; --ink:#221c26; --muted:#6f6573; --line:#ebe3da;
  --accent:#c1272d; --tint:color-mix(in srgb,var(--accent) 9%,var(--paper));
  --display:"Bricolage Grotesque","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --mast:"Bodoni Moda",Didot,Georgia,serif;
  --radius:24px;
  --shadow:0 1px 2px rgba(40,20,40,.06),0 18px 40px -22px rgba(40,20,40,.35);
  color-scheme:light;
}
html[lang="ar"]{--display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif;--hand:"Aref Ruqaa",serif;--mast:"Aref Ruqaa",serif}
html[lang="ar"] *{letter-spacing:0!important}
[data-w="home"]{--accent:#c1272d}
[data-w="morocco"]{--accent:#c1272d}
[data-w="egypt"]{--accent:#b07d1c}
[data-w="rome"]{--accent:#a4282c}
[data-w="ottoman"]{--accent:#c8102e}
[data-w="japan"]{--accent:#cf3653}
[data-w="vikings"]{--accent:#1f4e8c}
[data-w="versailles"]{--accent:#2c55a3}
[data-w="west"]{--accent:#9b4a1f}
[data-w="mexico"]{--accent:#0f7a50}
[data-w="spain"]{--accent:#c9401a}
[data-w="india"]{--accent:#d46f00}
[data-w="home-sweet-home"]{--accent:#cf4f74}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
header,main,footer{position:relative;z-index:1}

/* ---------- header ---------- */
header.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.logo svg{width:30px;height:30px;color:var(--accent);transition:transform .8s cubic-bezier(.2,1.3,.4,1)}
.logo:hover svg{transform:rotate(90deg)}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline-start:auto;mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:700;color:var(--muted);padding:7px 12px;border-radius:99px;transition:background .2s,color .2s}
.nav a:hover{color:var(--ink);background:var(--line)}
.nav a[aria-current="page"]{color:#fff;background:var(--accent)}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px;flex:none}
.langs button{border:0;background:none;font-size:13px;font-weight:800;padding:6px 11px;border-radius:99px;color:var(--muted);transition:all .2s}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.langs button:lang(ar){font-family:"Tajawal",sans-serif}

/* ---------- shared bits ---------- */
.kicker{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:99px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;transition:transform .25s cubic-bezier(.2,1.4,.4,1),background .25s}
.btn:hover{transform:translateY(-2px);background:var(--accent)}
.btn .arr{transition:transform .25s}.btn:hover .arr{transform:translateX(4px)}
html[dir="rtl"] .btn .arr{transform:scaleX(-1)}html[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes toss{from{opacity:0;transform:translateY(60px) rotate(calc(var(--r,0deg) + 10deg)) scale(.92)}}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-30deg)}70%{transform:scale(1.1) rotate(8deg)}100%{opacity:1}}

/* ---------- the magazine cover ---------- */
.cover{container-type:inline-size;position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#222;box-shadow:var(--shadow)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.cover::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 52%,rgba(0,0,0,.7) 100%)}
.cv-top{position:absolute;z-index:2;top:4.5cqw;inset-inline:0;text-align:center;color:#fff}
.cv-mast{font-family:var(--mast);font-weight:900;font-size:23cqw;line-height:.9;letter-spacing:.01em;text-shadow:0 .5cqw 3cqw rgba(0,0,0,.3)}
html[lang="ar"] .cv-mast{font-size:20cqw;line-height:1.1}
.cv-issue{margin-top:1.5cqw;font-size:3.1cqw;font-weight:800;letter-spacing:.24em;text-transform:uppercase;opacity:.92}
.cv-bottom{position:absolute;z-index:2;inset-inline:6cqw;bottom:6cqw;color:#fff}
.cv-title{font-family:var(--display);font-weight:800;font-size:9.5cqw;line-height:1;letter-spacing:-.02em}
.cv-line{margin-top:2cqw;font-size:4.2cqw;font-weight:700;line-height:1.25;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv-dot{display:inline-block;width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--accent);margin-inline-end:1.6cqw;vertical-align:.3cqw;box-shadow:0 0 0 .7cqw rgba(255,255,255,.85)}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(30px,6vw,80px);align-items:center;padding:clamp(40px,7vw,90px) 0 clamp(40px,6vw,70px)}
.hero h1{white-space:nowrap;font-size:clamp(84px,13.5vw,176px);line-height:.86;letter-spacing:-.05em;margin:.12em 0 .12em;color:var(--ink)}
html[lang="ar"] .hero h1{line-height:1.15}
.hero h1 span{display:inline-block;animation:drop .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*80ms + 100ms)}
.hero h1 span:hover{animation:jelly .7s both}
.hero h1 .star{color:var(--accent)}
@keyframes drop{from{opacity:0;transform:translateY(-70%) rotate(-10deg)}}
@keyframes jelly{30%{transform:scale(1.2,.82)}45%{transform:scale(.88,1.16)}60%{transform:scale(1.06,.95)}100%{transform:none}}
.hero .line{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.4vw,30px);line-height:1.2;letter-spacing:-.01em;max-width:22ch;animation:rise .8s both .45s}
.hero p{color:var(--muted);max-width:44ch;margin:18px 0 28px;animation:rise .8s both .55s}
.hero .btn{animation:rise .8s both .65s}
.mosaic{position:relative;aspect-ratio:1/1;max-width:600px;width:100%;margin-inline:auto}
.mosaic figure{position:absolute;margin:0;background:#fff;padding:8px;border-radius:20px;box-shadow:var(--shadow);transform:rotate(var(--r));animation:toss 1s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--i)*120ms + 250ms);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.mosaic figure:hover{transform:rotate(0) scale(1.05);z-index:5}
.mosaic img{border-radius:14px;aspect-ratio:4/3;object-fit:cover;width:100%}
.mosaic .m1{width:58%;top:4%;inset-inline-start:0;--r:-4deg;z-index:2}
.mosaic .m2{width:46%;top:0;inset-inline-end:0;--r:5deg}
.mosaic .m3{width:52%;bottom:6%;inset-inline-end:2%;--r:-3deg;z-index:3}
.mosaic .m4{width:44%;bottom:0;inset-inline-start:4%;--r:4deg;z-index:2}
.mosaic .m4 img,.mosaic .m2 img{aspect-ratio:1/1}
.badge{position:absolute;z-index:6;top:44%;inset-inline-start:44%;width:clamp(92px,11vw,124px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(14px,1.5vw,17px);line-height:1.05;padding:12px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent);animation:pop .7s both 1s}
.badge b{display:block;font-size:2em;line-height:.9}

.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.section-head h2{font-size:clamp(36px,5vw,60px)}
.section-head p{margin:0;color:var(--muted);max-width:40ch}
.stand{padding:clamp(30px,5vw,60px) 0 clamp(60px,8vw,100px)}
.issues{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3vw,40px) clamp(18px,2.6vw,32px)}
.issue{text-decoration:none;display:block;animation:rise .8s both;animation-delay:calc(var(--i)*60ms + 200ms)}
.issue .cover{transition:transform .45s cubic-bezier(.2,1.3,.4,1),box-shadow .45s}
.issue:hover .cover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 30px 60px -30px rgba(40,20,40,.55)}
.issue:hover .cover img{transform:scale(1.06)}
.issue-meta{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px;font-weight:700}
.issue-meta span:last-child{color:var(--muted);font-weight:600}
.issue-meta b{color:var(--accent)}

/* ---------- COUNTRY page ---------- */
.opener{background:var(--tint);border-bottom:1px solid var(--line)}
.opener .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(30px,6vw,80px);align-items:center;padding-block:clamp(40px,6vw,80px)}
.opener h1{font-size:clamp(50px,8vw,104px);margin:.18em 0 .16em;animation:rise .8s both .1s}
.role{font-family:var(--hand);font-weight:700;font-size:clamp(26px,2.6vw,34px);line-height:1.1;color:var(--accent);animation:rise .8s both .2s}
.tag{font-size:clamp(19px,1.7vw,22px);line-height:1.5;max-width:36ch;margin:20px 0 24px;animation:rise .8s both .3s}
.fact{display:flex;gap:14px;align-items:flex-start;max-width:46ch;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);animation:rise .8s both .4s}
.fact svg{flex:none;width:26px;height:26px;color:var(--accent);margin-top:2px}
.fact b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.fact span{font-weight:600}
.opener .cover-wrap{max-width:440px;width:100%;justify-self:center;transform:rotate(2.5deg);animation:toss 1s cubic-bezier(.2,1.2,.3,1) both .2s;--r:2.5deg}

.stories{padding:clamp(50px,7vw,90px) 0 20px}
.story{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(30px,5vw,70px);align-items:center;margin-bottom:clamp(70px,9vw,120px)}
.story.flip .pics{order:2}
.pics{position:relative}
.pics.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.pics.two .ph:nth-child(2){margin-top:44px}
.ph{position:relative;display:block;width:100%;padding:0;border:0;background:#ddd;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.ph img{width:100%;height:auto;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.pics.two .ph img{aspect-ratio:4/5;object-fit:cover}
.ph:hover{transform:translateY(-5px) rotate(-.8deg)}
.ph:hover img{transform:scale(1.05)}
.ph .zoom{position:absolute;inset-inline-end:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:all .25s}
.ph:hover .zoom{opacity:1;transform:none}
.ph .zoom svg{width:18px;height:18px}
.story-no{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.story-no::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}
.story h2{font-size:clamp(30px,3.4vw,44px);margin:12px 0 8px}
.story .kick{font-family:var(--hand);font-weight:700;font-size:clamp(24px,2.3vw,30px);line-height:1.15;color:var(--accent);margin:0 0 14px}
.story .tale{margin:0;font-size:18px;line-height:1.7;max-width:46ch}

.soon{padding:0 0 clamp(50px,7vw,80px)}
.soon h2{font-size:clamp(28px,3.4vw,40px);margin-bottom:8px}
.soon > p{color:var(--muted);margin:0 0 24px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.idea{background:var(--card);border-radius:18px;padding:18px 20px;border:1.5px dashed color-mix(in srgb,var(--accent) 40%,var(--line))}
.idea svg{width:22px;height:22px;color:var(--accent)}
.idea h3{font-size:19px;letter-spacing:-.01em;margin:10px 0 4px}
.idea p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}

.quote{background:var(--tint);border-block:1px solid var(--line)}
.quote .wrap{padding-block:clamp(50px,8vw,100px);display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);align-items:start}
.quote .mark{font-family:var(--mast);font-weight:900;font-size:clamp(120px,16vw,200px);line-height:.72;color:var(--accent)}
.quote blockquote{margin:10px 0 14px;font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,52px);line-height:1.12;letter-spacing:-.02em;max-width:22ch}
.quote cite{font-style:normal;font-family:var(--hand);font-weight:700;font-size:clamp(24px,2.4vw,30px);color:var(--accent)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-block:clamp(40px,6vw,70px)}
.pager a{display:grid;grid-template-columns:86px 1fr;gap:18px;align-items:center;text-decoration:none;background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.pager a:hover{transform:translateY(-4px)}
.pager a .cover{border-radius:12px;box-shadow:none}
.pager small{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pager strong{display:block;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,26px);line-height:1.1;margin-top:4px}
.pager .nx{grid-template-columns:1fr 86px;text-align:end}
.pager .nx .cover{order:2}

footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer .z{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--ink)}
footer .z svg{width:18px;height:18px;color:var(--accent)}

/* lightbox */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(94vw,1000px);max-height:94vh;overflow:visible}
dialog.lb::backdrop{background:rgba(25,18,28,.86);backdrop-filter:blur(8px)}
.lb figure{margin:0;background:#fff;padding:12px 12px 18px;border-radius:22px;animation:pop2 .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop2{from{opacity:0;transform:scale(.92)}}
.lb img{max-height:74vh;width:auto;margin:0 auto;border-radius:14px}
.lb figcaption{padding:14px 8px 0;max-width:60ch}
.lb figcaption strong{display:block;font-family:var(--display);font-size:22px;line-height:1.15}
.lb figcaption span{font-family:var(--hand);font-weight:700;font-size:24px;color:var(--accent)}
.lb-btn{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px}
.lb-btn:hover{background:rgba(255,255,255,.28)}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-close{position:fixed;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px}

@media (max-width:900px){
  .hero,.opener .wrap,.story{grid-template-columns:1fr}
  .story.flip .pics{order:0}
  .issues{grid-template-columns:repeat(2,1fr)}
  .opener .cover-wrap{max-width:360px}
  .bar .wrap{gap:12px}
  .logo small{display:none}
}
@media (max-width:640px){
  .bar .wrap{flex-wrap:wrap;height:auto;padding-block:10px}
  .nav{order:3;width:100%;margin:0}
  .langs{margin-inline-start:auto}
  .issues{gap:22px 14px}
  .pager{grid-template-columns:1fr}
  .pager .nx{grid-template-columns:86px 1fr;text-align:start}.pager .nx .cover{order:0}
  .quote .wrap{grid-template-columns:1fr}.quote .mark{font-size:110px;margin-bottom:-30px}
  .story .tale{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#sky{display:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header class="bar"><div class="wrap">
  <a class="logo" href="#" id="logo"></a>
  <nav class="nav" id="nav" aria-label="Countries"></nav>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="fr" lang="fr">FR</button>
    <button type="button" data-lang="ar" lang="ar">الدارجة</button>
  </div>
</div></header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<dialog class="lb" id="lb">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev">‹</button>
  <figure><img id="lbImg" alt=""><figcaption><strong id="lbTitle"></strong><span id="lbCap"></span></figcaption></figure>
  <button class="lb-btn lb-next" id="lbNext">›</button>
</dialog>

<script>
const I = n => "img/" + n + ".jpg";
const WORLDS = [
 { id:"egypt", country:"Egypt", place:"Giza", title:"Yakut of the Nile", glyph:"☥",
   role:"Pharaoh of the Two Lands · Destroyer of Sleep Schedules",
   tag:"Born on 30 June 2026 and already the most powerful ruler in 3,000 years of Egyptian history. Dad has been assigned to the camel.",
   fact:"Royal decree No. 1: every pyramid now has a changing table.",
   cover:I("egy-banquet"), coverPos:"22% 50%",
   sky:{shape:"spark",colors:["#e3a92b","#f0c35a","#45b3c7"],n:55,dir:-1},
   scenes:[
    {imgs:[I("egy-banquet")], t:"Baby Cleopatra's Royal Banquet", c:"A forty-course feast. She drank the milk.",
     story:"The palace cooks worked for three days: roast duck, honey cakes, a mountain of grapes and pomegranates the size of her head. Queen Cleopatra herself came to watch. Yakut looked at the whole table, grabbed her bottle and stuck her tongue out at the duck. The guests screamed with joy. The cooks went for a lie-down."},
    {imgs:["img/egypt-portrait-2.jpg"], t:"The Official Royal Portrait", c:"Ankh in one hand, tongue out. A pose for the history books.",
     story:"The royal painter asked for “regal and serious.” Yakut gave him “tongue out and wiggly.” He painted it anyway, because you don't argue with a pharaoh. It now hangs in every pyramid, and Dad has to bow to it every morning."},
    {imgs:["img/egypt-throne.jpg"], t:"Same Pose, Different Rank", c:"Dad thinks he's the pharaoh here. He's the chair.",
     story:"Dad practised his “thoughtful pharaoh” pose for an hour. Yakut copied it in two seconds and did it better. The court artist only painted her. Dad has filed a complaint with the Ministry of Thrones. It is being reviewed by Yakut."},
    {imgs:["img/egypt-camel.jpg"], t:"Arrival at Giza", c:"Sunglasses on. Pyramids rated 6/10.",

    {imgs:["img/egypt-scroll.jpg"], t:"Reviewing the Royal Budget", c:"Dad's allowance: DENIED.",
     story:"Every month the royal treasurer brings her the budget scroll. Line 14, Dad's allowance: denied. Line 15, more milk: approved. Line 16, a nap for Dad: she laughed for a full minute."},
    {imgs:["img/egypt-lounge.jpg"], t:"Peel My Grapes, Peasant", c:"The cat is her only trusted advisor.",

    {imgs:["img/egypt-portrait-1.jpg"], t:"Royal Portrait, Take Two", c:"Asked to smile. Stuck her tongue out instead.",
     story:"Take two was supposed to fix take one. The photographer said “big smile!” She held her tiny ankh, stared straight into the lens and did the tongue again. Take two is now the official version. There will be no take three."},

 { id:"morocco", country:"Morocco", place:"Marrakech", title:"Lalla Yakut", glyph:"❖",
   role:"Princess of the Kasbah · Queen of Mint Tea",

   scenes:[
    {imgs:[I("mor-tea"),I("mor-pour")], t:"The Mint Tea Ceremony", c:"Poured from a meter high. She wanted to do it herself.",
     story:"Moroccan mint tea is poured from way up high so it gets nice and foamy. Dad practised for a week, poured it perfectly and waited for applause. Then Yakut grabbed the teapot, poured it all over the tray and looked extremely proud of herself. Five-star service, according to her."},
    {imgs:[I("mor-desert"),I("mor-camel")], t:"Riding Into the Sahara", c:"The camel has asked for a raise.",
     story:"They wrapped up in blue like the desert travelers and rode into the dunes. The camel carried Dad, the water, the snacks, the stroller and four bags of baby clothes. Yakut carried nothing and complained the most. The camel is now in talks with its union."},
    {imgs:[I("mor-souk"),I("mor-souk2")], t:"Shopping the Souk", c:"Haggled everything down to free, just by staring.",
     story:"In the Marrakech souk you have to bargain. Dad offered 100. The shopkeeper said 300. Then Yakut, in her little red fez, just looked at him. Silence. He gave her the lantern for free, plus a rug, plus a hug. Dad still paid 100 somehow."},
    {imgs:[I("mor-riad2"),I("mor-riad")], t:"Princess of the Riad", c:"Fountain, orange trees, tiles, and one very important nap.",
     story:"A riad is a house with a secret garden in the middle. Theirs had a fountain, mosaic tiles and orange trees. She inspected the fountain, approved the tiles and fell asleep on Dad within four minutes. Dad didn't move for three hours. He calls it the best and worst afternoon of his life."},
    {imgs:[I("mor-koutoubia"),I("mor-arch")], t:"Marrakech Postcard", c:"Smiled for the camera, then tried to eat Dad's glasses.",

    {imgs:[I("mor-coast")], t:"Sea Breeze in Essaouira", c:"The wind took Dad's fez twice.",
     story:"Next stop: the seaside town of Essaouira, with white houses and old stone walls by the ocean. The wind blew Dad's fez off twice. The seagulls wanted her snacks. She shouted at them in baby language and they flew away. The seagulls have not been back."},
    {imgs:[I("mor-hamam")], t:"Hammam Day", c:"Steam, rose petals and one very splashy princess.",
     story:"The hammam is a steamy Moroccan bath. Dad wanted to relax. Yakut wanted to splash. Guess who won. Dad left with rose petals in his hair and the cleanest glasses in North Africa."},
    {t:"Dad on Tagine Duty", c:"Six hours of slow cooking. She had milk."},
    {t:"Magic Carpet Ride", c:"Bought one carpet in Marrakech. It is now her private jet."}

 { id:"rome", country:"Italy", place:"Rome", title:"Yakut Caesar", glyph:"SPQR",

   tag:"She came. She saw. She spit up on the Senate.",

   scenes:[
    {imgs:[I("rome-senate")], t:"Addressing the Senate", c:"A four-second speech. Every senator voted yes.",
     story:"Three hundred senators in white togas gathered to hear the new emperor speak. She raised one tiny hand, stuck out her tongue and said “ba.” The vote was 300 to 0. Nobody knows what they voted for. It is now the law."},
    {imgs:[I("rome-colosseum")], t:"Triumph at the Colosseum", c:"Fifty thousand fans. She's asleep.",
     story:"Fifty thousand Romans packed the Colosseum to cheer for their emperor. Rose petals fell from the sky, trumpets blew, the crowd went wild. She slept through the whole thing on a red velvet bed. Historians call it the most relaxed triumph in Roman history."},
    {imgs:[I("rome-crown")], t:"Laurel Crown Fitting", c:"Two royal tailors. Zero cooperation.",
     story:"Putting a laurel crown on a baby is harder than conquering Gaul. Two of the empire's best tailors tried. She gave them her angriest eyebrow. They both apologized and offered her a snack. The crown stayed on, mostly because she allowed it."},
    {imgs:[I("rome-chariot")], t:"The Chariot Race", c:"Top speed: 3 km/h. Still won.",
     story:"The great chariot race of Rome, with the fastest horses and the bravest drivers. She took the reins, frowned at the track, and the other chariots simply stopped to let her pass. Her horse said it had never felt so much pressure in its life."},
    {imgs:[I("rome-ettu")], t:"Et Tu, Daddy?", c:"He woke her from a nap. Rome will never forget.",
     story:"Dad leaned in to give her one tiny kiss during nap time. Big mistake. She woke up, looked at him like he'd betrayed the entire empire, and screamed loud enough to be heard in Greece. The senators wrote it all down. It's in the history books now."},
    {imgs:[I("rome-bath")], t:"Bath Time at the Roman Baths", c:"They built an aqueduct for one bath. Worth it.",
     story:"The Romans built miles of aqueducts to bring water into the city. All for this moment: one golden tub, a mountain of bubbles and an emperor with her tongue out. She splashed the palace guards. They thanked her."},
    {t:"Thumbs Up or Thumbs Down?", c:"The gladiators await her verdict. She's busy sucking the thumb."}
   ]},
 { id:"ottoman", country:"Türkiye", place:"Istanbul", title:"Sultana Yakut", glyph:"❀",

 versailles:{country:"France", place:"Versailles & Paris", title:"Sa Majesté Yakut", role:"Reine de Versailles · Protectrice de la purée",

  issue:"Le numéro France", lines:[["Le décret","Qu'ils mangent de la purée"],["Paris","Macarons : 400 validés"]], sticker:["Perruque","plus haute que Papa"], sub:"2 300 pièces au château. Toutes folles d'elle.",

  scenes:[
   {t:"La salle du trône", c:"Lustres, fauteuils dorés et une perruque pleine de roses.", story:"À Versailles, il y a de l'or partout : les murs, les fauteuils, les plafonds, même les poignées de porte. Elle s'est assise sur le plus grand fauteuil doré, a tenu son éventail en dentelle et a offert à la cour une langue royale. Trois duchesses se sont évanouies de mignonnerie. La quatrième a demandé un autographe."},
   {t:"Arrivée à Versailles", c:"2 300 pièces. Elle veut celle avec le goûter.", story:"Elle est arrivée au château en robe bleu pastel avec des fleurs dans les cheveux et a contemplé 2 300 pièces de chic royal à la française. Les gardes se sont inclinés. Les jardiniers se sont inclinés. Sa seule question : dans quelle pièce est le goûter ?"},
   {t:"Le jardin de la sieste royale", c:"Censée faire la sieste. Elle a posé à la place.", story:"Les jardins de Versailles sont immenses, avec des fontaines, des fleurs et des haies parfaites, faits pour la détente royale. Papa lui a trouvé un coin tranquille pour la sieste. Elle a mis sa tiare et a posé pour les photos pendant quarante minutes. C'est Papa qui a fait la sieste. Ne lui dites rien."},
   {t:"Café à Paris", c:"Béret, croissant, petite tasse. Très français.", story:"Prochaine étape : un petit café près de la tour Eiffel. Béret rouge, marinière, croissant, petite tasse. Elle avait l'air plus parisienne que les Parisiens. Quand le serveur lui a demandé ce qu'elle voulait, elle a renversé sa tasse et montré le croissant de Papa. Très français, en effet."},
   {t:"L'inspectrice des macarons", c:"Elle a léché un macaron. Elle a validé les 400.", story:"Paris a les meilleurs pâtissiers du monde, alors ils l'ont nommée pâtissière d'honneur. Elle a inspecté toute une tour de macarons roses, jaunes et chocolat, et en a léché exactement un. Validé. La boutique a mis sa photo en vitrine."},
   {t:"Une perruque plus haute que Papa", c:"Une montagne de boucles poudrées. Elle n'en sait rien.", story:"Karim, le vrai Papa, a eu une veste royale très chic et s'est mis à côté d'elle pour le portrait officiel. C'est là que tout le monde a remarqué que sa perruque est presque plus haute que lui. Le peintre royal a parlé d'une « composition très équilibrée ». Papa n'a rien dit. Il connaît sa place."},
   {t:"Qu'ils mangent de la purée", c:"Décret royal : des carottes pour tout le monde. Écrasées."},
   {t:"La galerie des Glaces", c:"Elle a trouvé l'autre bébé dans le miroir. Ce sont désormais des rivales."},
   {t:"Le sceptre baguette", c:"Elle règne sur la France avec une baguette. Et la mâchouille."}

   {t:"Le shérif prend ses fonctions", c:"Étoile brillante, mini-bottes, tolérance zéro pour être posée.", story:"Premier jour comme shérif. Elle a eu un chapeau, un gilet, un bandana rouge et deux étoiles brillantes, pour être sûre. Nouvelle loi n° 1 : personne n'a le droit de la poser. Nouvelle loi n° 2 : Papa doit faire les voix quand il lit des histoires. La ville n'a jamais été aussi sûre."},
   {t:"La Liberté, version mini", c:"La statue mesure 93 mètres. Elle est plus célèbre.", story:"Un petit saut à New York pour voir la statue de la Liberté. Elle est venue avec sa propre torche, sa propre couronne et son propre livre. Les touristes ne savaient plus laquelle photographier. La vraie statue est là depuis 1886 et n'a jamais été aussi jalouse."},
   {t:"Top Bébé", c:"Lunettes, écharpe au vent, zéro leçon de pilotage.", story:"Elle a mis le casque en cuir et les lunettes et est montée dans un vieil avion étoilé. Des leçons de pilotage ? Non. Un brevet de pilote ? Absolument pas. Elle a pris les commandes et a dit « ba ! ». La tour de contrôle a vidé tout le ciel, au cas où."},
   {t:"Karim rejoint la bande", c:"Haut-de-forme à New York, chapeau de cowboy au Texas. Le même grand sourire.", story:"Karim, le vrai Papa, n'arrivait pas à choisir entre New York et le Texas, alors il a fait les deux : un immense haut-de-forme étoilé devant la statue de la Liberté, et un chapeau de cowboy dans le Far West. Elle avait une tenue assortie les deux fois, parce que c'est une pro. Papa porte encore le chapeau à la maison."},

   {t:"Duel à l'heure de la sieste", c:"Midi pile. Dix pas. Papa a cligné des yeux le premier."},
   {t:"La ruée vers l'or", c:"De l'or trouvé le premier jour. Elle a tout de suite voulu le manger."}

 morocco:{country:"المغرب", place:"مراكش", title:"لالة ياقوت", role:"أميرة القصبة · ملكة أتاي بالنعناع",

   {t:"الطريق للصحرا", c:"الجمل طلب الزيادة.", story:"تلفّو ف الزرق بحال رجال الصحرا ودخلو للكثبان. الجمل هز بابا، الما، الماكلة، الكروسة وربعة ديال الصاكات ديال حوايج الدرية. ياقوت ما هزت والو، وهي اللي كانت كتشكي كثر. الجمل دابا كيتفاوض مع النقابة ديالو."},

   {t:"كارط بوسطال من مراكش", c:"ضحكات للتصويرة، ومن بعد بغات تاكل النضاضر ديال بابا.", story:"اللور ديالهم كاينة الكتبية، أشهر صومعة ف مراكش. بابا بغا تصويرة زوينة بحال الكارط بوسطال. هي سلمات على السياح، دارت بفمها للحمام وحاولات تاكل النضاضر ديالو. هادو هوما جوج التصاور الوحيدين اللي كلشي فيهم كيشوف ف الكاميرا."},

  quote:"حتى نتي يا ياقوت؟ كل ليلة ف التلاتة ديال الصباح؟", by:"كريم، شيخ الكوش",
  scenes:[
   {t:"الخطاب قدام مجلس الشيوخ", c:"خطاب ديال ربع ثواني. كاع الشيوخ صوتو بنعم.", story:"تلتمية شيخ لابسين التوجا البيضا تجمعو باش يسمعو الإمبراطورة الجديدة. هزات يد صغيورة، خرجات لسانها وقالت «با». النتيجة: 300 ضد 0. حتى واحد ما عرف على شنو صوتو. ودابا ولا قانون."},
   {t:"الانتصار ف الكولوسيوم", c:"خمسين ألف معجب. وهي ناعسة.", story:"خمسين ألف روماني عمّرو الكولوسيوم باش يشجعو الإمبراطورة ديالهم. الورد طايح من السما، النفار كيصوني، والجمهور مقلوب. هي نعسات من الأول حتى للخر فوق فراش ديال القطيفة الحمرا. المؤرخين كيقولو هادا أهدأ انتصار ف تاريخ روما."},
   {t:"تجريب تاج الغار", c:"جوج خياطة ملكيين. والتعاون: صفر.", story:"تلبّس تاج الغار لدرية صعيب كثر من غزو بلاد الغال. جوج من أحسن الخياطة ف الإمبراطورية حاولو. عطاتهم الحاجب الغضبان ديالها. بجوج طلبو السماح وعطاوها شي حاجة تاكلها. التاج بقى، غير حيت هي بغات."},
   {t:"سباق العربات", c:"السرعة القصوى: 3 كلم ف الساعة. وربحات.", story:"السباق الكبير ديال العربات ف روما، بأسرع العودان وأشجع السواقة. شدات اللجام، عوجات حواجبها، والعربات الأخرين وقفو غير باش يخليوها تدوز. العود ديالها قال عمرو ما حس بهاد الضغط ف حياتو."},
   {t:"حتى نتا يا بابا؟", c:"فيقها من النعاس. روما عمرها ما غاتنسى.", story:"بابا تحنا باش يعطيها بوسة صغيورة وهي ناعسة. غلطة كبيرة. فاقت، شافت فيه بحال إلا خان الإمبراطورية كاملة، وغوتات حتى تسمعات ف اليونان. الشيوخ كتبو كلشي. دابا راه ف كتب التاريخ."},
   {t:"الدوش ف الحمامات الرومانية", c:"بناو قناة ديال الما على دوش واحد. وكان يستاهل.", story:"الرومان بناو كيلومترات ديال القنوات باش يجيبو الما للمدينة. كلشي على هاد اللحظة: بانيو ديال الذهب، جبل ديال الرغوة وإمبراطورة خارجة لسانها. شوّشات الما على حراس القصر. وشكروها."},
   {t:"الصبع للفوق ولا للتحت؟", c:"المصارعين كيتسناو الحكم ديالها. وهي مشغولة كتمص صبعها."}
  ]},
 ottoman:{country:"تركيا", place:"إسطنبول", title:"السلطانة ياقوت", role:"سلطانة السبع تلال · حارسة الحلقوم",
  tag:"كاع الخزامى ف إسطنبول تغرسو على شرفها. حاولات تاكل وحدة.",
  fact:"ياقوت بالتركية معناها الياقوتة الحمرا. والخزينة ديال القصر دابا فيها جوج.",
  issue:"عدد إسطنبول", lines:[["حياة القصر","أقوى واحد ف طوب قابي تزاد نهار 30 يونيو 2026"],["التذواق","والو كيفوت الحليب"]], sticker:["ياقوت","= ياقوتة"], sub:"كاع الخزامى ف إسطنبول تغرسو على شرفها.",
  quote:"وعدوني بقصر. عطاوني صاك ديال الكوش. بالحرير.", by:"كريم، الصدر الأعظم",
  scenes:[
   {t:"المجلس ف طوب قابي", c:"الوزرا كيجيبو المشاكل. وهي كتجيب تكريعة.", story:"كل صباح القصر كامل كيدير الصف باش يحكي للسلطانة المشاكل ديال الإمبراطورية: الضرايب، الحدود، جمل تلف. كتسمع مزيان، كتهز يد ملكية… وكتكرّع. المشكل تحل. الوزرا ما فاهمين كيفاش، ولكن ديما كتنفع."},
   {t:"تذواق الحلقوم الملكي", c:"ربعين نوع ديال الحلقوم. ونعسات.", story:"الحلوانية ديال القصر جابو أحسن حلقوم: بالورد، بالفستق، بالحامض، صينية ديال النقرة عامرة. بقاو كيتسناو وهوما مخلوعين. شافت، تنهدات، ونعسات ويدها على حنكها. الحلوانية فهموها مدح. وبابا كلا الصينية كاملة."},
   {t:"الصدر الأعظم (بابا)", c:"ترقى لصدر أعظم. مسؤول على البيبرون.", story:"بابا خدا عمامة كبيرة، قفطان ديال القطيفة وأهم خدمة ف الإمبراطورية: يشد البيبرون الملكي. داخلها بجد. هي داخلاه بجد شوية قل. شوفو هاد الوجه: هادي باطرونة كتقيّم الخدام ديالها."},
   {t:"الدورة ف البوسفور", c:"جوج قارات. نعسة وحدة.", story:"إسطنبول جالسة على جوج قارات، أوروبا وآسيا، والبوسفور ف الوسط. قطعاتو مع الغروب ف فلوكة ديال الذهب، ملفوفة ف الفرو، بين الجوامع والبابورات. دابا هي الدرية الوحيدة اللي نعسات ف جوج قارات ف عشية وحدة."},
   {t:"نهار الحمام التركي", c:"الرخام، الرغوة وورد الورد. وآراء عالية بزاف.", story:"الحمام التركي كلو رخام سخون وبخار. الخدامات وجدو ورد الورد، زلايف ديال الذهب وفوطات رطبين. هي زادت الرغوة ف السقف، ف الأرض وف وجه وحدة من الخدامات. التقييم: خمس نجوم وتلاتة ديال التشويشات."},
   {t:"فرقة التهويدة الملكية", c:"أعلى فرقة ف التاريخ، كتعزف بشوية.", story:"الفرقة العسكرية العثمانية كانت مشهورة بالصداع، حتى كان العدو كيهرب. الليلة عندهم مهمة وحدة: يعزفو تهويدة. الطبول على رؤوس الصبعان. النفار كيوشوش. خدات خمسة وربعين دقيقة، ولكن ف الخر نعسات. الفرقة كاملة خدات الميداليات."}
  ]},

  quote:"جريت هاد الريكشا اليابان كاملة. وهي نعسات الطريق كاملة.", by:"كريم، مصلحة الريكشا",
  scenes:[
   {t:"تفتيش الساموراي", c:"شوفة وحدة قاصحة. الجيش كامل طلب السماح.", story:"عشرة آلاف ساموراي لابسين الدرع كانو كيتسناو الشوغون ديالهم قدام القصر. وصلات، حركات المروحة ديال الذهب مرة وحدة، وكلهم انحناو. من بعد خرجات لسانها. عاودو انحناو، باش يكونو مرتاحين."},
   {t:"ما تغلباتش ف السومو", c:"البطل دخل للحلبة. البطل خرج من الحلبة.", story:"بطل السومو 180 كيلو ديال العضلات. دخلات للحلبة على ربعة بالحزام الصغير ديالها وشافت فيه شوفة وحدة. طاح على ضهرو، ومن بعد شد راسو بيديه. الحكام عاودو الإعادة خمس مرات. النتيجة الرسمية: ربحات الدرية."},
   {t:"تفتيش نوار الكرز", c:"كل ورقة، وافقات عليها بيدها.", story:"ف الربيع، اليابان كتعمر بنوار الكرز الوردي، وخاص شي حد يتأكد بلي كلو زوين. هاد الحد هو هي. كتفتش كل ورقة وهي معوجة حواجبها بحال شي أستاذة. حتى لدابا: 4 مليون مقبولة، وجوج مرفوضين حيت «وردي بزاف»."},
   {t:"الناقدة ديال طقوس أتاي", c:"تلت ساعات ديال الطقوس. وجابت البيبرون ديالها.", story:"طقوس أتاي اليابانية هادية، بشوية وأنيقة بزاف. المعلم ديال أتاي دوز تلت ساعات كيوجد أحسن زلافة ماتشا. دفعاتها بصبع واحد وهزات البيبرون ديالها. المعلم دابا خدا شي أيام راحة باش يفكر ف الحياة."},
   {t:"بابا كيجر الريكشا", c:"من طوكيو حتى لكيوطو. بلا راحة. أوامرها.", story:"ف التصويرة الأولى، بابا كيجر الريكشا ف الزناقي القدام وهو ندمان على كل قرار ف حياتو. ف التانية، بابا خدّم واحد بلاصتو بالسكات. هي عاقت. وما عجبهاش الحال. من بعد عشر دقايق، بابا رجع لخدمة الريكشا."},
   {t:"درس الخط الياباني", c:"كتبات «حلم». الحلم ديال بابا: النعاس.", story:"معلم الخط علمها ترسم 夢، اللي معناها «حلم». رسماتها زوينة بزاف، ومن بعد رسمات على الطبلة، على الورقة وعلى الكم ديالها. اللور منها، بابا شاد راسو. الحلم ديالو ديما هو هو: ليلة كاملة ديال النعاس."},
   {t:"كريم، ساموراي شرفي", c:"الدرع حقيقي. والشجاعة غير للتصويرة.", story:"كريم، بابا الحقيقي، لبس درع ساموراي حقيقي وتصور تحت نوار الكرز بحال شي محارب كبير. شجاع، قوي، فرحان براسو. من بعد هي جراتو من ودنو، والمحارب الكبير دار صوت حتى ساموراي ما خاصو يديرو. هاد التصاور تشدو قبل ديك اللحظة بالضبط."}
  ]},

  scenes:[
   {t:"قبطانة السفينة", c:"ربعين جدّاف، قبطانة صغيورة، وبلا رحمة.", story:"كانت واقفة ف القدام ديال السفينة الفايكينغ بالشاقور، الترس والخوذة ديال القرون، والفيوردات دايزين. الربعين جدّاف اللور منها عمرهم ما جدفو بهاد السرعة. ماشي بسباب الريح. حيت هي كانت كتشوف فيهم."},
   {t:"مسلحة وزوينة", c:"الشاقور حقيقي. واللسان حتى هو.", story:"الفايكينغ عطاوها شاقور، ترس وكاب حمرا وقالو ليها: «دابا بيني راسك قاصحة.» بقات قاصحة ثانية وحدة بالضبط، ومن بعد خرجات لسانها. الدوار كامل ضحك. سمّاوها أخطر فايكينغ ف النرويج، وحتى واحد ما عرف علاش."},
   {t:"العرضة ف القاعة الكبيرة", c:"المحاربين شربو العسل. وهي شربات الحليب ف قرن.", story:"القاعة كانت عامرة باللحم المشوي، الغنا العالي ومحاربين كيضربو على الطبالي. كلشي كيشرب من القرون، حتى هي. القرن ديالها كان عامر بالحليب السخون. سالات هي الأولى وضربات بالقرن على الطبلة. المحاربين صفقو. وبابا طلب كلينيكس."},
   {t:"تحت الشفق القطبي", c:"السما كاملة دارت عرض. وهي فضلات الجرو.", story:"بقاو الليل كامل ف التلج كيتسناو الشفق القطبي. ف الخر السما ولات خضرا وبدات كتشطح فوق الجبال. بابا بكى شوية. هي حتى ما هزات عينيها، حيت لقات جرو هاسكي رطب. وبصراحة، عندها الحق."},
   {t:"العيد الوطني ديال النرويج", c:"تاج ديال النوار، علام، وما عارفة والو شنو واقع.", story:"ف العيد الوطني، كلشي كيلبس البوناد، اللباس التقليدي، وكيحرك علامات صغار. هي لبسات اللبسة كاملة بتاج ديال النوار وبقات كتحرك العلام بحال شي محترفة. من بعد حاولات تاكل العلام. الاستعراض كمل بلا ما حد يسول."},
   {t:"كريم كيدخل للغارة", c:"بابا الحقيقي ف الفرو الحقيقي. وما عارف شنو سنا.", story:"كريم، بابا الحقيقي، دخل مع الطاقم ديال الفايكينغ، لبس الفرو وضحك للكاميرا بحال إلا عايش أحسن نهار ف حياتو. من بعد القبطانة قالت ليه بلي هو اللي غادي يجدف. ف الربعين بلاصة. باقي كيجدف حتى لدابا. صيفطو ليه شي حاجة ياكلها."},
   {t:"الغارة على مخازن الحليب", c:"كاع التلاجات ديال إسكندنافيا، تسرقو."},

   {t:"تسمية السفينة", c:"سمّاتها «تكريعة». والطاقم فرحان بزاف."}
  ]},

   {t:"الوصول لفرساي", c:"2300 بيت. وهي بغات غير اللي فيه الماكلة.", story:"وصلات للقصر بكسوة زرقة فاتحة والنوار ف شعرها، وشافت 2300 بيت ديال الفخامة الفرنسية. الحراس انحناو. الجنانة انحناو. السؤال الوحيد ديالها: فين البيت اللي فيه الماكلة؟"},
   {t:"جردة النعاس الملكية", c:"كان خاصها تنعس. تصورات بلاصة.", story:"الجرادي ديال فرساي كبار بزاف، فيهم الخصات، النوار والسياجات المقادين، كاملين للراحة الملكية. بابا لقى ليها بلاصة هادية باش تنعس. هي لبسات التاج وبقات تتصور ربعين دقيقة. بابا هو اللي نعس. ما تقولو ليها والو."},
   {t:"قهوة ف باريس", c:"بيري، كرواسة، وكاس صغير. فرنسي بزاف.", story:"المحطة الجاية: قهوة صغيرة حدا البرج ديال إيفل. بيري حمر، تيشورت مخطط، كرواسة وكاس صغير. بانت باريزية كثر من الباريزيين. ملي الكارسون سولها شنو بغات، قلبات الكاس وورات بصبعها الكرواسة ديال بابا. فرنسي بزاف بصح."},
   {t:"مفتشة الماكارون", c:"لحسات ماكارون وحدة. ووافقات على 400.", story:"باريس فيها أحسن الحلوانية ف العالم، داكشي علاش داروها حلوانية شرفية. فتشات برج كامل ديال الماكارون الوردي، الصفر وبالشوكولا، ولحسات وحدة بالضبط. مقبول. الحانوت حط التصويرة ديالها ف الفيترينة."},

        <h2>${esc(s.t)}</h2>
        <p class="kick">${esc(s.c)}</p>
        <p class="tale">${esc(s.story)}</p>
      </div>
    </article>`).join("")}
  </section>
  ${dev.length?`<section class="wrap soon"><h2>${esc(ui().soonH)}</h2><p>${esc(ui().soonP)}</p>
    <div class="ideas">${dev.map(s=>`<div class="idea">${CAM}<h3>${esc(s.t)}</h3><p>${esc(s.c)}</p></div>`).join("")}</div></section>`:""}
  <section class="quote"><div class="wrap">
    <div class="mark" aria-hidden="true">“</div>
    <div><div class="kicker">${esc(ui().quoteL)}</div><blockquote>${esc(x.quote)}</blockquote><cite>— ${esc(x.by)}</cite></div>
  </div></section>
  <nav class="wrap pager" aria-label="${esc(ui().all)}">
    <a href="#${prev.id}">${cover(prev,WORLDS.indexOf(prev))}<span><small>${LANG==="ar"?"→":"←"} ${esc(ui().prev)}</small><strong>${esc(L(prev).title)}</strong></span></a>
    <a class="nx" href="#${next.id}">${cover(next,WORLDS.indexOf(next))}<span><small>${esc(ui().next)} ${LANG==="ar"?"←":"→"}</small><strong>${esc(L(next).title)}</strong></span></a>
  </nav>`;
  document.querySelectorAll(".ph").forEach(b=>b.addEventListener("click",()=>openLb(+b.dataset.idx)));
  startSky(Object.assign({},w.sky,{n:Math.round(w.sky.n*.45)}));
}

function route(keepScroll){ const w=WORLDS.find(x=>x.id===location.hash.slice(1));
  chrome(w?w.id:null); w?renderWorld(w):renderHome(); if(!keepScroll) window.scrollTo({top:0,behavior:"instant"}); }
addEventListener("hashchange",()=>route());
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  LANG=b.dataset.lang; try{localStorage.setItem("yakut-lang",LANG)}catch(e){} route(true); }));

/* lightbox */
const lb=$("#lb"); let li=0;
function showLb(){const s=current[li]; $("#lbImg").src=s.img; $("#lbImg").alt=s.t; $("#lbTitle").textContent=s.t; $("#lbCap").textContent=s.c; $("#lbPrev").hidden=$("#lbNext").hidden=current.length<2;}
function openLb(i){li=i;showLb();try{lb.showModal()}catch(e){lb.setAttribute("open","")}}
$("#lbClose").onclick=()=>lb.close();
$("#lbPrev").onclick=()=>{li=(li-1+current.length)%current.length;showLb()};
$("#lbNext").onclick=()=>{li=(li+1)%current.length;showLb()};
lb.addEventListener("click",e=>{if(e.target===lb)lb.close()});
addEventListener("keydown",e=>{if(!lb.open)return;if(e.key==="ArrowLeft")$("#lbPrev").click();if(e.key==="ArrowRight")$("#lbNext").click()});

/* gentle weather for each country */
const cv=$("#sky"),cx=cv.getContext("2d");let parts=[],cfg=null,raf=0,W=0,H=0;
function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);size();
function spawn(init){const c=cfg,r=c.shape==="bubble"?3+Math.random()*4:c.shape==="dot"?1+Math.random()*2.4:c.shape==="spark"?1+Math.random()*2.2:c.shape==="dust"?1+Math.random()*2.5:5+Math.random()*6;
  return{x:Math.random()*W,y:init?Math.random()*H:(c.dir<0?H+20:c.dir>0?-20:Math.random()*H),vx:c.dir===0?.4+Math.random()*.9:(Math.random()-.5)*.5,
    vy:c.dir*(.25+Math.random()*(c.shape==="dot"?.9:.6)),r,rot:Math.random()*6.28,vr:(Math.random()-.5)*.04,ph:Math.random()*6.28,
    col:c.colors[Math.floor(Math.random()*c.colors.length)],a:.35+Math.random()*.55}}
function startSky(c){cfg=c;parts=Array.from({length:W<600?Math.round(c.n*.5):c.n},()=>spawn(true));
  if(reduced){cx.clearRect(0,0,W,H);return} if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,W,H);
  for(const p of parts){p.ph+=.02;p.x+=p.vx+Math.sin(p.ph)*.35;p.y+=p.vy;p.rot+=p.vr;
    if(p.y>H+30||p.y<-30||p.x>W+30||p.x<-30){Object.assign(p,spawn(false));if(cfg.dir===0)p.x=-20}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.col;
    if(cfg.shape==="bubble"){cx.globalAlpha=.55;cx.lineWidth=2;cx.strokeStyle=p.col;cx.beginPath();cx.arc(0,0,p.r*3.2,0,6.28);cx.stroke();cx.globalAlpha=.12;cx.fill();cx.globalAlpha=.8;cx.fillStyle="#fff";cx.beginPath();cx.arc(-p.r,-p.r,p.r*.7,0,6.28);cx.fill()}
    else if(cfg.shape==="spark"){cx.globalAlpha=p.a*(.55+.45*Math.sin(p.ph*2));cx.beginPath();for(let k=0;k<4;k++){cx.rotate(Math.PI/2);cx.moveTo(0,0);cx.quadraticCurveTo(p.r*.4,p.r*.4,0,p.r*2.6)}cx.fill()}
    else if(cfg.shape==="petal"){cx.globalAlpha=p.a;cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55*Math.abs(Math.sin(p.ph))+1,0,0,6.28);cx.fill()}
    else if(cfg.shape==="leaf"){cx.globalAlpha=p.a;cx.beginPath();cx.moveTo(-p.r,0);cx.quadraticCurveTo(0,-p.r*.6,p.r,0);cx.quadraticCurveTo(0,p.r*.6,-p.r,0);cx.fill()}
    else if(cfg.shape==="rect"){cx.globalAlpha=p.a;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2*Math.abs(Math.cos(p.ph))+1)}
    else{cx.globalAlpha=p.a*.8;cx.beginPath();cx.arc(0,0,p.r,0,6.28);cx.fill()}
    cx.restore()}
  raf=requestAnimationFrame(tick)}
route();
</script>
</body>
</html>
